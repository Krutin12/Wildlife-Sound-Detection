name: listenleaf
description: "ListenLeaf — Animal Sound Identification Mobile App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  provider: ^6.1.2

  # HTTP & API
  http: ^1.2.0
  dio: ^5.4.0

  # Audio Recording & Playback
  record: ^7.1.1
  audioplayers: ^6.0.0
  file_picker: ^8.1.7

  # Storage & Auth
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.2.2

  # UI & Design
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  fl_chart: ^0.68.0
  cached_network_image: ^3.3.1

  # Utilities
  intl: ^0.19.0
  path_provider: ^2.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

dependency_overrides:
  flutter_plugin_android_lifecycle: 2.0.24

flutter:
  uses-material-design: true

  assets:
    - assets/images/
